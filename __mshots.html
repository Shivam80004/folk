<!doctype html>
<html><head><meta charset="utf-8"></head>
<body style="margin:0;background:#444;display:flex;flex-wrap:wrap;gap:0;width:WIDTHpx">
<script>
// Temporary harness: a grid of phone-sized iframes, each scrolled one screen further down the page.
const q = new URLSearchParams(location.search);
const W = +q.get('w') || 390, H = +q.get('h') || 844, N = +q.get('n') || 14, start = +q.get('s') || 0;
document.body.style.width = (W * 7) + 'px';
for (let i = 0; i < N; i++) {
  const f = document.createElement('iframe');
  f.style.cssText = 'border:0;width:' + W + 'px;height:' + H + 'px;display:block';
  f.src = 'Main.dc.html';
  f.onload = () => setTimeout(() => f.contentWindow.scrollTo(0, (start + i) * (H - 60)), 1500);
  document.body.appendChild(f);
}
</script>
</body></html>
